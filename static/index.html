<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DataAgent Skill 平台</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app">
    <aside id="sidebar" class="sidebar">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none">
            <path d="M12 2l2.1 6.2L20 10l-5.9 1.8L12 18l-2.1-6.2L4 10l5.9-1.8L12 2z" fill="currentColor"/>
            <circle cx="19" cy="18" r="3" fill="currentColor" opacity=".55"/>
          </svg>
        </span>
        <span class="brand-name">DataAgent Skill 平台</span>
      </div>

      <div class="side-actions">
        <button id="newChatBtn" class="new-chat-btn">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M12 5v14M5 12h14"/>
          </svg>
          开启新对话
        </button>
        <button id="importBtn" class="new-chat-btn">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/>
          </svg>
          导入 Skill
        </button>
      </div>
      <input type="file" id="importFile" accept=".md,.json,.txt" hidden />

      <div class="search">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>
        </svg>
        <input type="text" placeholder="搜索历史对话" />
      </div>

      <nav id="historyList" class="history" aria-label="历史对话"></nav>

      <div class="sidebar-footer">
        <span class="user-avatar">业</span>
        <div class="user-meta">
          <strong>业务专家</strong>
          <span>企业管理员</span>
        </div>
        <button id="themeBtn" class="icon-btn" title="切换深色模式">
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="menuBtn" class="icon-btn menu-btn" title="菜单">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
        <span id="chatTitle" class="chat-title">新对话</span>
        <span id="status" class="status idle">待命</span>
      </header>

      <section id="welcome" class="welcome">
        <div class="welcome-inner">
          <span class="welcome-logo">
            <svg viewBox="0 0 24 24" width="42" height="42" fill="none">
              <path d="M12 2l2.1 6.2L20 10l-5.9 1.8L12 18l-2.1-6.2L4 10l5.9-1.8L12 2z" fill="currentColor"/>
            </svg>
          </span>
          <h1>DataAgent Skill 平台</h1>
          <p>把优秀员工的岗位经验，沉淀为业务人员可自建、可复用、可治理的 AI 员工能力。</p>
          <div id="chips" class="chips">
            <button class="chip">帮我创建一个抖音直播运营复盘 Skill</button>
            <button class="chip">帮我创建一个销售经营分析 Skill</button>
            <button class="chip">帮我创建一个用户增长分析 Skill</button>
          </div>
        </div>
      </section>

      <section id="chatThread" class="chat-thread hidden" aria-live="polite"></section>

      <footer class="composer">
        <div id="dataPanel" class="data-panel hidden">
          <div class="data-head">
            <span>输入数据（JSON）</span>
            <span id="sampleStatus" class="sample-status"></span>
            <button id="dataCloseBtn" class="link-btn">收起</button>
          </div>
          <textarea id="inputData" rows="10" spellcheck="false"></textarea>
        </div>

        <div class="composer-inner">
          <div class="composer-box">
            <textarea id="input" rows="1" placeholder="给 Skill 生成平台发送消息…" aria-label="输入岗位经验需求"></textarea>
            <div class="composer-tools">
              <div class="tool-left">
                <button id="sampleDataBtn" class="tool-btn">
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/>
                  </svg>
                  示例数据
                </button>
                <button id="deepThinkBtn" class="tool-btn toggle">
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <path d="M9 3h6M10 3v4l-6 9a2 2 0 0 0 1.7 3h12.6a2 2 0 0 0 1.7-3l-6-9V3"/>
                  </svg>
                  深度思考
                </button>
              </div>
              <button id="sendBtn" class="send-btn" title="发送">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 19V5M5 12l7-7 7 7"/>
                </svg>
              </button>
            </div>
          </div>
          <p class="composer-hint">输入岗位经营需求，系统将自动生成可执行的 AI 员工技能，并可用示例数据验证。</p>
        </div>
      </footer>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
